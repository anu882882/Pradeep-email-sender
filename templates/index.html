<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Secure Mail Console</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<script
src="https://challenges.cloudflare.com/turnstile/v0/api.js"
async
defer>
</script>

</head>


<body>


<header>

<div class="top-brand">

<div class="shield">♢</div>

<div>

<strong>Secure Mail Console</strong>

</div>

</div>


<a
class="logout"
href="/logout">

↪ Logout

</a>

</header>


<main>


<div class="page-title">

<span>➤</span>

<strong>Bulk Email Sender</strong>

</div>


<div class="dashboard">


<!-- =================================
     LEFT
================================= -->

<section class="compose card">


<div class="card-title">

<span>✎</span>

<strong>Compose Message</strong>

</div>


<div class="form-grid">


<div>

<label>
Sender Name
</label>

<input
id="name"
placeholder="E.g., John Doe">

</div>


<div>

<label>
Your Gmail
</label>

<input
id="gmail"
type="email"
placeholder="you@gmail.com">

</div>


<div>

<label>
App Password
</label>

<div class="password-box">

<input
id="pass"
type="password"
placeholder="16-char app password">

<button
type="button"
id="togglePassword">

◉

</button>

</div>

</div>


<div>

<label>
Email Subject
</label>

<input
id="sub"
placeholder="Enter subject line...">

</div>


</div>


<label class="message-label">

Message Body (Plain Text / HTML)

</label>


<textarea
id="msg"
class="message"
placeholder="Write your email here... Spintax supported: {Hi|Hello} {name}"></textarea>


<div class="turnstile-area">

<div
class="cf-turnstile"
data-sitekey="{{ turnstile_site_key }}"
data-theme="light">
</div>

</div>


</section>


<!-- =================================
     RIGHT
================================= -->

<div class="right-column">


<!-- RECIPIENTS -->

<section class="card recipients-card">


<div class="card-title recipients-title">

<div>

<span>♣</span>

<strong>Recipients</strong>

</div>


<span
class="found"
id="found">

0 found

</span>

</div>


<div class="recipient-help">

Paste emails (comma separated, new lines, or Excel copy)

</div>


<textarea
id="recipients"
class="recipient-input"
placeholder="recipient1@example.com
recipient2@example.com"></textarea>


</section>


<!-- PROGRESS -->

<section class="card progress-card">


<div class="card-title">

<span>◕</span>

<strong>Progress Monitor</strong>

</div>


<div class="stats">


<div class="stat">

<span>TOTAL</span>

<strong id="total">
0
</strong>

</div>


<div class="stat sent-stat">

<span>SENT</span>

<strong id="sent">
0
</strong>

</div>


<div class="stat failed-stat">

<span>FAILED</span>

<strong id="failed">
0
</strong>

</div>


<div class="stat remaining-stat">

<span>REMAINING</span>

<strong id="remaining">
0
</strong>

</div>


</div>


<div class="progress-track">

<div
id="progress"
class="progress-bar">
</div>

</div>


<div
class="send-status"
id="status">

● Ready to send

</div>


<button
id="send"
class="send-button">

➤ Send All

</button>


</section>


</div>


</div>


</main>


<script>


const $ =
id => document.getElementById(id);


let sending = false;


/* =====================================
   PASSWORD
===================================== */

$("togglePassword").onclick = function(){

    const input =
        $("pass");

    if(
        input.type === "password"
    ){

        input.type = "text";

    }else{

        input.type = "password";

    }

};


/* =====================================
   RECIPIENT PARSER
===================================== */

function getRecipients(){

    return [

        ...new Set(

            $("recipients")
            .value
            .split(/[\s,;]+/)
            .map(
                x =>
                x.trim().toLowerCase()
            )
            .filter(Boolean)

        )

    ];

}


/* =====================================
   COUNT
===================================== */

function updateCount(){

    const list =
        getRecipients();

    $("found").textContent =
        `${list.length} found`;

    $("total").textContent =
        list.length;

    $("remaining").textContent =
        list.length;

}


$("recipients").addEventListener(
    "input",
    updateCount
);


/* =====================================
   MESSAGE CHECK
===================================== */

function messageCheck(){

    const text =
        $("sub").value +
        " " +
        $("msg").value;


    if(
        /<\s*(script|iframe|object|embed)\b/i
        .test(text)
    ){

        $("status").textContent =
            "⚠ Unsafe HTML detected.";

        return false;

    }


    if(
        /javascript\s*:/i
        .test(text)
    ){

        $("status").textContent =
            "⚠ Unsafe content detected.";

        return false;

    }


    if(
        (text.match(/https?:\/\//gi) || [])
        .length > 5
    ){

        $("status").textContent =
            "⚠ Too many links.";

        return false;

    }


    return true;

}


$("sub").addEventListener(
    "input",
    messageCheck
);

$("msg").addEventListener(
    "input",
    messageCheck
);


/* =====================================
   TURNSTILE
===================================== */

function getTurnstileToken(){

    const element =
        document.querySelector(
            '[name="cf-turnstile-response"]'
        );

    return element
        ? element.value
        : "";

}


/* =====================================
   DELAY
===================================== */

function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(
            resolve,
            ms
        )
    );

}


/* =====================================
   ADD ROW
===================================== */

function addRecipient(
    email,
    success
){

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "mail-row " +
        (
            success
            ? "mail-success"
            : "mail-failed"
        );


    row.innerHTML =

        `<span class="mail-icon">${
            success ? "✓" : "×"
        }</span>` +

        `<span>${email}</span>`;


    const list =
        document.createElement(
            "div"
        );


    /*
     * Add to the top of progress area.
     */

    $("status").before(row);

}


/* =====================================
   SEND
===================================== */

$("send").onclick =
async function(){


    if(sending)
        return;


    const all =
        getRecipients();


    if(!all.length){

        $("status").textContent =
            "Add recipients first.";

        return;

    }


    if(all.length > 25){

        $("status").textContent =
            "Maximum 25 recipients.";

        return;

    }


    const required = [

        [
            "name",
            "Enter sender name."
        ],

        [
            "gmail",
            "Enter Gmail address."
        ],

        [
            "pass",
            "Enter Gmail App Password."
        ],

        [
            "sub",
            "Enter email subject."
        ],

        [
            "msg",
            "Enter message."
        ]

    ];


    for(
        const [id, error] of required
    ){

        if(
            !$(id).value.trim()
        ){

            $("status").textContent =
                error;

            return;

        }

    }


    if(!messageCheck())
        return;


    const token =
        getTurnstileToken();


    if(!token){

        $("status").textContent =
            "Please complete Cloudflare verification.";

        return;

    }


    sending = true;

    $("send").disabled =
        true;


    $("sent").textContent =
        "0";

    $("failed").textContent =
        "0";

    $("remaining").textContent =
        all.length;


    $("progress").style.width =
        "0%";


    /*
     * Clear previous live rows.
     */

    document
        .querySelectorAll(
            ".mail-row"
        )
        .forEach(
            row =>
            row.remove()
        );


    let sentCount = 0;

    let failedCount = 0;

    let processed = 0;


    /*
     * ----------------------------------
     * BATCH SIZE = 5
     * ----------------------------------
     */

    for(
        let start = 0;
        start < all.length;
        start += 5
    ){

        const batch =
            all.slice(
                start,
                start + 5
            );


        $("status").textContent =
            `● Sending ${start + 1}-${Math.min(
                start + 5,
                all.length
            )} of ${all.length}`;


        try{


            const response =
                await fetch(

                    "/api/send-batch",

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                            "application/json"

                        },

                        body:
                            JSON.stringify({

                                sender_name:
                                    $("name").value,

                                gmail:
                                    $("gmail").value,

                                app_password:
                                    $("pass").value,

                                subject:
                                    $("sub").value,

                                message:
                                    $("msg").value,

                                recipients:
                                    batch,

                                turnstile_token:
                                    start === 0
                                    ? token
                                    : ""

                            })

                    }

                );


            const data =
                await response.json();


            if(!response.ok){

                $("status").textContent =
                    data.error ||
                    "Batch failed.";

                break;

            }


            /*
             * --------------------------------
             * UPDATE IMMEDIATELY AFTER BATCH
             * --------------------------------
             */

            for(
                const item of data.sent
            ){

                sentCount++;

                processed++;

                addRecipient(
                    item.email,
                    true
                );

            }


            for(
                const item of data.failed
            ){

                failedCount++;

                processed++;

                addRecipient(
                    item.email,
                    false
                );

            }


            const remaining =
                all.length -
                processed;


            $("sent").textContent =
                sentCount;


            $("failed").textContent =
                failedCount;


            $("remaining").textContent =
                remaining;


            $("progress").style.width =

                Math.round(

                    (
                        processed /
                        all.length
                    ) * 100

                ) + "%";


            /*
             * --------------------------------
             * WAIT BETWEEN 5-MAIL BATCHES
             * --------------------------------
             */

            if(
                start + 5 < all.length
            ){

                $("status").textContent =
                    `✓ ${processed} sent/processed — next batch starting...`;

                await sleep(2500);

            }


        }catch(error){

            $("status").textContent =
                "Server connection failed.";

            break;

        }

    }


    /*
     * ----------------------------------
     * COMPLETE
     * ----------------------------------
     */

    if(
        sentCount + failedCount === all.length
    ){

        $("status").textContent =
            `● Completed — ${sentCount} sent, ${failedCount} failed.`;

        $("progress").style.width =
            "100%";

        if(window.turnstile){

            window.turnstile.reset();

        }

    }


    sending = false;

    $("send").disabled =
        false;

};


updateCount();


</script>


</body>

</html>
