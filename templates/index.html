<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Mail Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
  <div>
    <b>✉ Secure Mail Console</b>
    <small>Gmail Mail Sender</small>
  </div>
  <a href="/logout">Logout</a>
</header>

<main>

<section class="card">

  <h2>Sender</h2>

  <label>Sender Name</label>
  <input id="name" placeholder="Your name">

  <label>Your Gmail</label>
  <input id="gmail" type="email" placeholder="your@gmail.com">

  <label>App Password</label>
  <input id="pass" type="password" placeholder="Gmail App Password">

  <label>Subject</label>
  <input id="sub" placeholder="Email subject">

  <label>Message Body</label>
  <textarea id="msg" placeholder="Write your message..."></textarea>

  <button id="send">Send Emails</button>

  <p id="status"></p>

</section>


<section class="card">

  <h2>Recipients</h2>

  <textarea id="recipients"
    placeholder="one@email.com&#10;two@email.com&#10;three@email.com"></textarea>

  <div class="stats">
    <div>
      <b id="total">0</b>
      <span>Total</span>
    </div>

    <div>
      <b id="sent">0</b>
      <span>Sent</span>
    </div>

    <div>
      <b id="failed">0</b>
      <span>Failed</span>
    </div>
  </div>

  <div class="bar">
    <i id="progress"></i>
  </div>

  <h3>Live Recipients Dispatch</h3>

  <div id="list"></div>

</section>

</main>


<script>

const $ = id => document.getElementById(id);

$("send").onclick = async () => {

  let r = $("recipients").value
    .split(/[\s,;]+/)
    .filter(Boolean);

  $("total").textContent = r.length;
  $("sent").textContent = 0;
  $("failed").textContent = 0;
  $("progress").style.width = "0%";
  $("list").innerHTML = "";

  if (!r.length) {
    $("status").textContent = "Add recipients first.";
    return;
  }

  $("send").disabled = true;
  $("status").textContent = "Sending...";

  try {

    let res = await fetch("/api/send", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        sender_name: $("name").value,
        gmail: $("gmail").value,
        app_password: $("pass").value,
        subject: $("sub").value,
        message: $("msg").value,
        recipients: r.join("\n")
      })
    });

    let d = await res.json();

    if (!res.ok) {
      $("status").textContent = d.error || "Sending failed.";
      return;
    }

    $("sent").textContent = d.sent || 0;
    $("failed").textContent = d.failed || 0;

    let done = (d.sent || 0) + (d.failed || 0);
    let percent = r.length
      ? Math.round(done / r.length * 100)
      : 0;

    $("progress").style.width = percent + "%";

    (d.sent_emails || []).forEach(x => {
      $("list").innerHTML +=
        `<div>✓ ${x}</div>`;
    });

    (d.failed_emails || []).forEach(x => {
      $("list").innerHTML +=
        `<div>✕ ${x.email}</div>`;
    });

    $("status").textContent =
      `Completed: ${d.sent || 0} sent, ${d.failed || 0} failed.`;

  } catch (e) {

    $("status").textContent =
      "Server connection failed.";

  } finally {

    $("send").disabled = false;

  }
};

</script>

</body>
</html>
