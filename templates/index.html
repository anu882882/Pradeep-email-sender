<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Operations - Secure Mail Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <div class="brand-icon">M</div>
            <div>
                <div class="brand-kicker">MAIL OPERATIONS</div>
                <div class="brand-title">Secure Mail Console</div>
            </div>
        </div>

        <a class="logout-button" href="{{ url_for('logout') }}">Logout</a>
    </div>
</header>

<main class="container">

    <div class="page-heading">
        <div>
            <h1>Bulk Email Sender</h1>
            <p>Compose and send messages to your opted-in recipients.</p>
        </div>
    </div>

    <div class="dashboard-grid">

        <section class="card compose-card">
            <div class="section-title">Compose Message</div>

            <form id="sendForm">

                <div class="two-column">

                    <div class="field">
                        <label for="senderName">Sender Name</label>
                        <input id="senderName" type="text" placeholder="Your name" required>
                    </div>

                    <div class="field">
                        <label for="gmail">Your Gmail</label>
                        <input id="gmail" type="email" placeholder="your@gmail.com" required>
                    </div>

                    <div class="field">
                        <label for="appPassword">Gmail App Password</label>
                        <input id="appPassword" type="password" placeholder="Google App Password" required>
                    </div>

                    <div class="field">
                        <label for="subject">Email Subject</label>
                        <input id="subject" type="text" placeholder="Email subject" required>
                    </div>

                </div>

                <div class="field body-field">

                    <div class="body-header">
                        <label for="messageBody">Message Body</label>

                        <div class="mode-buttons">
                            <button type="button" id="plainButton" class="mode active">Plain Text</button>
                            <button type="button" id="htmlButton" class="mode">HTML</button>
                        </div>
                    </div>

                    <select id="fontChoice" aria-label="Message font">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                        <option value="Garamond">Garamond</option>
                        <option value="Palatino Linotype">Palatino Linotype</option>
                        <option value="Lucida Sans">Lucida Sans</option>
                        <option value="Segoe UI">Segoe UI</option>
                        <option value="Calibri">Calibri</option>
                        <option value="Cambria">Cambria</option>
                        <option value="system-ui">System UI</option>
                    </select>

                    <textarea id="messageBody" placeholder="Write your message here..." required></textarea>
                </div>

                <div class="field">
                    <label for="recipients">Recipients</label>
                    <textarea
                        id="recipients"
                        class="recipients-input"
                        placeholder="Enter recipient email addresses, separated by commas or new lines."
                        required
                    ></textarea>
                    <div class="field-hint">Maximum 25 recipients per request.</div>
                </div>

                <label class="consent-row">
                    <input type="checkbox" id="consent">
                    <span>I confirm these recipients have agreed to receive these emails.</span>
                </label>

                <button type="submit" id="sendButton" class="send-button">
                    Start Sending
                </button>

            </form>
        </section>

        <aside class="right-column">

            <section class="card status-card">
                <div class="section-title">Sending Overview</div>

                <div class="stats-grid">
                    <div class="stat">
                        <span>Sent</span>
                        <strong id="sentCount">0</strong>
                    </div>

                    <div class="stat">
                        <span>Failed</span>
                        <strong id="failedCount">0</strong>
                    </div>

                    <div class="stat">
                        <span>Total</span>
                        <strong id="totalCount">0</strong>
                    </div>
                </div>

                <div class="progress-track">
                    <div id="progressBar" class="progress-bar"></div>
                </div>

                <div id="statusMessage" class="status-message">
                    Ready to send.
                </div>
            </section>

            <section class="card">
                <div class="section-title">Activity Log</div>
                <div id="activityLog" class="activity-log">No activity yet.</div>
            </section>

        </aside>

    </div>
</main>

<script>
const form = document.getElementById("sendForm");
const messageBody = document.getElementById("messageBody");
const fontChoice = document.getElementById("fontChoice");
const sendButton = document.getElementById("sendButton");

let isHtml = false;

document.getElementById("plainButton").addEventListener("click", () => {
    isHtml = false;

    document.getElementById("plainButton").classList.add("active");
    document.getElementById("htmlButton").classList.remove("active");
});

document.getElementById("htmlButton").addEventListener("click", () => {
    isHtml = true;

    document.getElementById("htmlButton").classList.add("active");
    document.getElementById("plainButton").classList.remove("active");
});

fontChoice.addEventListener("change", () => {
    messageBody.style.fontFamily = fontChoice.value;
});

messageBody.addEventListener("input", () => {
    messageBody.style.height = "auto";
    messageBody.style.height =
        Math.min(messageBody.scrollHeight, 700) + "px";
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (sendButton.disabled) return;

    const payload = {
        sender_name: document.getElementById("senderName").value,
        gmail: document.getElementById("gmail").value,
        app_password: document.getElementById("appPassword").value,
        subject: document.getElementById("subject").value,
        message: messageBody.value,
        recipients: document.getElementById("recipients").value,
        is_html: isHtml,
        consent_confirmed: document.getElementById("consent").checked
    };

    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    document.getElementById("statusMessage").textContent =
        "Sending messages...";

    document.getElementById("activityLog").textContent =
        "Sending request...";

    try {
        const response = await fetch("/send", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Sending request failed."
            );
        }

        document.getElementById("sentCount").textContent =
            result.sent;

        document.getElementById("failedCount").textContent =
            result.failed;

        document.getElementById("totalCount").textContent =
            result.total;

        const processed = result.sent + result.failed;

        document.getElementById("progressBar").style.width =
            (processed / result.total * 100) + "%";

        document.getElementById("statusMessage").textContent =
            result.message;

        document.getElementById("activityLog").textContent =
            result.failed_recipients.length
                ? "Failed recipients:\n" + result.failed_recipients.join("\n")
                : "All messages were accepted by the SMTP server.";

    } catch (error) {
        document.getElementById("statusMessage").textContent =
            error.message;

        document.getElementById("activityLog").textContent =
            error.message;

    } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Start Sending";
    }
});
</script>

</body>
</html>
