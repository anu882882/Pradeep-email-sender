<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Secure Mail Console
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>
            Secure Mail Console
        </h1>

    </div>


    <a
        href="/logout"
        class="logout-button"
    >

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </a>

</header>


<main class="container">


    <div class="page-heading">

        <h2>
            <i class="fa-solid fa-paper-plane"></i>

            Bulk Email Sender
        </h2>

    </div>


    <div class="main-grid">


        <!-- LEFT -->

        <section class="card compose-card">


            <div class="card-title">

                <h3>

                    <i class="fa-regular fa-pen-to-square"></i>

                    Compose Message

                </h3>

            </div>


            <div class="form-grid">


                <div class="field">

                    <label>
                        Sender Name
                    </label>

                    <input
                        id="senderName"
                        type="text"
                        placeholder="E.g., John Doe"
                    >

                </div>


                <div class="field">

                    <label>
                        Your Gmail
                    </label>

                    <input
                        id="gmail"
                        type="email"
                        placeholder="you@gmail.com"
                    >

                </div>


                <div class="field">

                    <label>
                        App Password
                    </label>

                    <div class="password-box">

                        <input
                            id="appPassword"
                            type="password"
                            placeholder="16-char app password"
                        >

                        <button
                            type="button"
                            onclick="togglePassword()"
                        >

                            <i
                                id="passwordIcon"
                                class="fa-regular fa-eye"
                            ></i>

                        </button>

                    </div>

                </div>


                <div class="field">

                    <label>
                        Email Subject
                    </label>

                    <input
                        id="subject"
                        type="text"
                        placeholder="Enter subject line..."
                    >

                </div>


                <div class="field full">

                    <label>
                        Message Body
                        <span>
                            (Plain Text / HTML)
                        </span>
                    </label>

                    <textarea
                        id="message"
                        rows="12"
                        placeholder="Write your email here... Spintax supported: {Hi|Hello} {name}"
                    ></textarea>

                </div>


                <div class="spam-heading">

                    <i class="fa-solid fa-shield-halved"></i>

                    Spam Protection

                </div>


                <div class="spam-box">

                    <div class="cloud-check">

                        <i class="fa-solid fa-check"></i>

                    </div>

                    <div>

                        <strong>
                            Success!
                        </strong>

                        <small>
                            Protected sending workspace
                        </small>

                    </div>

                    <div class="cloudflare">

                        <strong>
                            CLOUDFLARE
                        </strong>

                        <small>
                            Privacy · Help
                        </small>

                    </div>

                </div>


            </div>

        </section>


        <!-- RIGHT -->

        <section class="right-column">


            <!-- RECIPIENTS -->

            <div class="card recipients-card">


                <div class="section-heading">

                    <div>

                        <h3>

                            <i class="fa-solid fa-users"></i>

                            Recipients

                        </h3>

                        <p>
                            Paste emails (comma separated, new lines, or Excel copy)
                        </p>

                    </div>


                    <div
                        id="recipientCount"
                        class="found-badge"
                    >
                        0 found
                    </div>

                </div>


                <textarea
                    id="recipients"
                    class="recipients-input"
                    placeholder="recipient1@example.com&#10;recipient2@example.com"
                ></textarea>


            </div>


            <!-- PROGRESS -->

            <div class="card progress-card">


                <div class="progress-title">

                    <h3>

                        <i class="fa-solid fa-chart-pie"></i>

                        Progress Monitor

                    </h3>

                </div>


                <div class="stats-grid">


                    <div class="stat-box">

                        <span>
                            TOTAL
                        </span>

                        <strong id="totalCount">
                            0
                        </strong>

                    </div>


                    <div class="stat-box">

                        <span>
                            SENT
                        </span>

                        <strong
                            id="sentCount"
                            class="green"
                        >
                            0
                        </strong>

                    </div>


                    <div class="stat-box">

                        <span>
                            FAILED
                        </span>

                        <strong
                            id="failedCount"
                            class="red"
                        >
                            0
                        </strong>

                    </div>


                    <div class="stat-box">

                        <span>
                            REMAINING
                        </span>

                        <strong
                            id="remainingCount"
                            class="orange"
                        >
                            0
                        </strong>

                    </div>


                </div>


                <div class="progress-track">

                    <div
                        id="progressBar"
                        class="progress-bar"
                    ></div>

                </div>


                <div class="status-row">

                    <span>

                        <i
                            id="statusIcon"
                            class="fa-solid fa-circle-pause"
                        ></i>

                        <span id="statusText">
                            Ready to send
                        </span>

                    </span>

                </div>


                <button
                    id="sendButton"
                    class="send-all"
                    type="button"
                    onclick="startQueue()"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                    Send All

                </button>


                <button
                    id="stopButton"
                    class="stop-button"
                    type="button"
                    onclick="stopQueue()"
                    disabled
                >

                    <i class="fa-solid fa-stop"></i>

                    Stop Queue

                </button>


            </div>


        </section>


    </div>


</main>


<div
    id="toast"
    class="toast"
></div>


<script>


let recipients = [];

let currentIndex = 0;

let sent = 0;

let failed = 0;

let queueRunning = false;

let stopRequested = false;


const recipientInput =
    document.getElementById(
        "recipients"
    );


recipientInput.addEventListener(
    "input",
    updateRecipients
);


function parseRecipients() {

    const raw =
        recipientInput.value;


    const emails =
        raw
            .split(/[\s,;]+/)
            .map(
                item => item.trim().toLowerCase()
            )
            .filter(Boolean);


    const unique = [];


    for (
        const email of emails
    ) {

        if (
            !unique.includes(email)
        ) {

            unique.push(email);

        }

    }


    return unique.slice(0, 25);

}


function updateRecipients() {

    if (queueRunning) {
        return;
    }


    recipients =
        parseRecipients();


    currentIndex = 0;

    sent = 0;

    failed = 0;


    updateCounters();

}


function updateCounters() {

    const total =
        recipients.length;


    const remaining =
        Math.max(
            total - sent - failed,
            0
        );


    document.getElementById(
        "recipientCount"
    ).textContent =
        `${total} found`;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "sentCount"
    ).textContent =
        sent;


    document.getElementById(
        "failedCount"
    ).textContent =
        failed;


    document.getElementById(
        "remainingCount"
    ).textContent =
        remaining;


    const completed =
        sent + failed;


    const percentage =
        total > 0
            ? completed / total * 100
            : 0;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${percentage}%`;

}


function getFormData() {

    return {

        sender_name:
            document.getElementById(
                "senderName"
            ).value.trim(),

        gmail:
            document.getElementById(
                "gmail"
            ).value.trim(),

        app_password:
            document.getElementById(
                "appPassword"
            ).value.trim(),

        subject:
            document.getElementById(
                "subject"
            ).value.trim(),

        body:
            document.getElementById(
                "message"
            ).value,

        is_html:
            false

    };

}


function validateForm(data) {

    if (!data.sender_name) {

        return "Enter Sender Name.";

    }


    if (!data.gmail) {

        return "Enter Gmail address.";

    }


    if (!data.app_password) {

        return "Enter App Password.";

    }


    if (!data.subject) {

        return "Enter Email Subject.";

    }


    if (!data.body.trim()) {

        return "Enter Message Body.";

    }


    return null;

}


async function startQueue() {

    if (queueRunning) {
        return;
    }


    recipients =
        parseRecipients();


    if (
        recipients.length === 0
    ) {

        showToast(
            "Add at least one recipient.",
            true
        );

        return;

    }


    const data =
        getFormData();


    const validation =
        validateForm(data);


    if (validation) {

        showToast(
            validation,
            true
        );

        return;

    }


    queueRunning = true;

    stopRequested = false;


    currentIndex = 0;

    sent = 0;

    failed = 0;


    setRunningUI(true);


    updateCounters();


    for (
        ;
        currentIndex < recipients.length;
        currentIndex++
    ) {


        if (stopRequested) {
            break;
        }


        const recipient =
            recipients[currentIndex];


        setStatus(
            `Sending ${currentIndex + 1} of ${recipients.length}`,
            "sending"
        );


        try {

            const response =
                await fetch(
                    "/send",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            ...data,

                            recipient:
                                recipient

                        })

                    }
                );


            const result =
                await response.json();


            if (
                result.success
            ) {

                sent++;

            } else {

                failed++;

            }


        } catch (error) {

            failed++;

        }


        updateCounters();


        if (
            currentIndex <
            recipients.length - 1 &&
            !stopRequested
        ) {

            await delay(1500);

        }

    }


    queueRunning = false;

    setRunningUI(false);


    if (stopRequested) {

        setStatus(
            "Queue stopped",
            "stopped"
        );

    } else {

        setStatus(
            "Completed",
            "complete"
        );

    }


    updateCounters();


    showToast(
        stopRequested
            ? "Queue stopped."
            : "All recipients processed.",
        false
    );

}


function stopQueue() {

    if (!queueRunning) {
        return;
    }


    stopRequested = true;


    setStatus(
        "Stopping...",
        "stopping"
    );

}


function setRunningUI(running) {

    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const stopButton =
        document.getElementById(
            "stopButton"
        );


    sendButton.disabled =
        running;


    stopButton.disabled =
        !running;


    recipientInput.disabled =
        running;


    if (running) {

        sendButton.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Sending...
        `;

    } else {

        sendButton.innerHTML = `
            <i class="fa-solid fa-paper-plane"></i>
            Send All
        `;

    }

}


function setStatus(
    text,
    state
) {

    const statusText =
        document.getElementById(
            "statusText"
        );


    const statusIcon =
        document.getElementById(
            "statusIcon"
        );


    statusText.textContent =
        text;


    if (state === "sending") {

        statusIcon.className =
            "fa-solid fa-spinner fa-spin";

    } else if (
        state === "complete"
    ) {

        statusIcon.className =
            "fa-solid fa-circle-check";

    } else if (
        state === "stopped"
    ) {

        statusIcon.className =
            "fa-solid fa-circle-stop";

    } else {

        statusIcon.className =
            "fa-solid fa-circle-pause";

    }

}


function resetQueue() {

    if (queueRunning) {

        stopQueue();

    }


    currentIndex = 0;

    sent = 0;

    failed = 0;

    updateRecipients();

    setStatus(
        "Ready to send",
        "ready"
    );

}


function togglePassword() {

    const input =
        document.getElementById(
            "appPassword"
        );


    const icon =
        document.getElementById(
            "passwordIcon"
        );


    if (
        input.type === "password"
    ) {

        input.type = "text";

        icon.className =
            "fa-regular fa-eye-slash";

    } else {

        input.type = "password";

        icon.className =
            "fa-regular fa-eye";

    }

}


function delay(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function showToast(
    message,
    error = false
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        "toast show";


    if (error) {

        toast.classList.add(
            "toast-error"
        );

    }


    setTimeout(
        () => {

            toast.className =
                "toast";

        },
        3500
    );

}


updateRecipients();


</script>


</body>

</html>
