<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Mail Console</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="page">

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <div class="brand-name">
                Secure Mail Console
            </div>
        </div>

        <button
            class="logout-btn"
            id="logoutBtn"
            type="button"
        >
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout (Double Click)
        </button>

    </header>


    <div class="page-title">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Bulk Email Sender</span>
    </div>


    <main class="dashboard">

        <!-- LEFT -->
        <section class="left-column">

            <div class="card compose-card">

                <div class="card-heading">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Compose Message</span>
                </div>


                <div class="form-grid">

                    <div class="field">
                        <label>Sender Name</label>

                        <input
                            id="senderName"
                            type="text"
                            placeholder="Sender Name"
                            autocomplete="off"
                        >
                    </div>


                    <div class="field">
                        <label>Your Gmail</label>

                        <input
                            id="gmail"
                            type="email"
                            placeholder="yourname@gmail.com"
                            autocomplete="off"
                        >
                    </div>


                    <div class="field">

                        <label>App Password</label>

                        <div class="password-wrapper">

                            <input
                                id="appPassword"
                                type="password"
                                placeholder="Google App Password"
                                autocomplete="off"
                            >

                            <button
                                id="togglePassword"
                                class="eye-btn"
                                type="button"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <div class="field">
                        <label>Email Subject</label>

                        <input
                            id="subject"
                            type="text"
                            placeholder="Email subject"
                        >
                    </div>

                </div>


                <div class="field body-field">

                    <label>Message Body</label>

                    <textarea
                        id="messageBody"
                        placeholder="Write your message here..."
                    ></textarea>

                </div>


                <div class="protection">

                    <div class="protection-title">
                        <i class="fa-solid fa-shield"></i>
                        Spam Protection
                    </div>

                    <div class="protection-box">

                        <div class="success-icon">
                            <i class="fa-solid fa-check"></i>
                        </div>

                        <div class="protection-text">
                            <strong>Ready</strong>
                            <span>
                                Security checks are enabled.
                            </span>
                        </div>

                        <div class="cloud-mark">
                            <i class="fa-solid fa-cloud"></i>
                        </div>

                    </div>

                </div>


                <button
                    id="sendBtn"
                    class="send-btn"
                    type="button"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                    Send Selected Email
                </button>

            </div>

        </section>


        <!-- RIGHT -->
        <section class="right-column">

            <div class="card recipients-card">

                <div class="recipients-header">

                    <div>

                        <div class="card-heading">
                            <i class="fa-solid fa-users"></i>
                            <span>Recipients</span>
                        </div>

                        <div class="helper">
                            Up to 25 email addresses
                        </div>

                    </div>

                    <div
                        id="recipientCount"
                        class="count-badge"
                    >
                        0 / 25
                    </div>

                </div>


                <textarea
                    id="recipients"
                    class="recipient-input"
                    placeholder="Enter up to 25 email addresses, one per line..."
                ></textarea>


                <div class="recipient-note">
                    <i class="fa-solid fa-circle-info"></i>
                    One address is selected at a time for sending.
                </div>


                <div
                    id="recipientList"
                    class="recipient-list"
                ></div>

            </div>


            <div class="card progress-card">

                <div class="card-heading">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Progress Monitor</span>
                </div>


                <div class="stats-grid">

                    <div class="stat-box">
                        <span class="stat-label">TOTAL</span>
                        <strong id="totalValue">0</strong>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">SENT</span>
                        <strong
                            id="sentValue"
                            class="sent-value"
                        >
                            0
                        </strong>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">FAILED</span>
                        <strong
                            id="failedValue"
                            class="failed-value"
                        >
                            0
                        </strong>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">REMAINING</span>
                        <strong
                            id="remainingValue"
                            class="remaining-value"
                        >
                            0
                        </strong>
                    </div>

                </div>


                <div class="progress-track">
                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>
                </div>


                <div
                    id="statusText"
                    class="sending-status"
                >
                    <i class="fa-regular fa-circle"></i>
                    Ready to send
                </div>


                <div class="action-row">

                    <button
                        id="nextBtn"
                        class="sending-btn"
                        type="button"
                        disabled
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        Send Next
                    </button>

                    <button
                        id="resetBtn"
                        class="stop-btn"
                        type="button"
                    >
                        <i class="fa-solid fa-rotate-left"></i>
                        Reset
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

const MAX_RECIPIENTS = 25;

const recipientsInput =
    document.getElementById("recipients");

const recipientCount =
    document.getElementById("recipientCount");

const recipientList =
    document.getElementById("recipientList");

const sendBtn =
    document.getElementById("sendBtn");

const nextBtn =
    document.getElementById("nextBtn");

const resetBtn =
    document.getElementById("resetBtn");

const totalValue =
    document.getElementById("totalValue");

const sentValue =
    document.getElementById("sentValue");

const failedValue =
    document.getElementById("failedValue");

const remainingValue =
    document.getElementById("remainingValue");

const progressFill =
    document.getElementById("progressFill");

const statusText =
    document.getElementById("statusText");

const toast =
    document.getElementById("toast");


let recipients = [];
let statuses = [];
let currentIndex = 0;
let sending = false;


function showToast(message, type = "success") {

    toast.textContent = message;

    toast.className =
        "toast show " + type;

    setTimeout(() => {
        toast.className = "toast";
    }, 3500);
}


function parseRecipients() {

    const raw =
        recipientsInput.value;

    const parts =
        raw
        .split(/[\n,;]+/)
        .map(item => item.trim())
        .filter(Boolean);

    const unique = [];

    for (const email of parts) {

        if (!unique.includes(email)) {
            unique.push(email);
        }

    }

    return unique.slice(0, MAX_RECIPIENTS);
}


function renderRecipients() {

    recipients = parseRecipients();

    statuses = recipients.map(() => "pending");

    currentIndex = 0;

    recipientCount.textContent =
        `${recipients.length} / ${MAX_RECIPIENTS}`;

    totalValue.textContent =
        recipients.length;

    sentValue.textContent = "0";
    failedValue.textContent = "0";

    remainingValue.textContent =
        recipients.length;

    renderRecipientList();
    updateProgress();
    updateButtons();

    if (recipients.length > MAX_RECIPIENTS) {

        showToast(
            "Only the first 25 recipients are accepted.",
            "error"
        );
    }
}


function renderRecipientList() {

    recipientList.innerHTML = "";

    recipients.forEach((email, index) => {

        const row =
            document.createElement("div");

        row.className =
            "recipient-row";

        if (index === currentIndex) {
            row.classList.add("active");
        }

        const number =
            document.createElement("span");

        number.className =
            "recipient-number";

        number.textContent =
            index + 1;


        const address =
            document.createElement("span");

        address.className =
            "recipient-address";

        address.textContent =
            email;


        const status =
            document.createElement("span");

        status.className =
            "recipient-status";


        if (statuses[index] === "sent") {

            status.innerHTML =
                '<i class="fa-solid fa-circle-check"></i>';

            status.classList.add("sent");

        } else if (statuses[index] === "failed") {

            status.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i>';

            status.classList.add("failed");

        } else {

            status.innerHTML =
                '<i class="fa-regular fa-clock"></i>';

        }


        row.appendChild(number);
        row.appendChild(address);
        row.appendChild(status);

        recipientList.appendChild(row);
    });
}


function updateProgress() {

    const total =
        recipients.length;

    const sent =
        statuses.filter(x => x === "sent").length;

    const failed =
        statuses.filter(x => x === "failed").length;

    const completed =
        sent + failed;

    const remaining =
        Math.max(total - completed, 0);

    sentValue.textContent = sent;
    failedValue.textContent = failed;
    remainingValue.textContent = remaining;

    const percentage =
        total
            ? (completed / total) * 100
            : 0;

    progressFill.style.width =
        `${percentage}%`;


    if (!total) {

        statusText.innerHTML =
            '<i class="fa-regular fa-circle"></i> Ready to send';

    } else if (completed === total) {

        statusText.innerHTML =
            '<i class="fa-solid fa-circle-check"></i> All selected emails processed';

    } else {

        statusText.innerHTML =
            `<i class="fa-solid fa-paper-plane"></i>
             Ready for recipient ${currentIndex + 1}`;
    }
}


function updateButtons() {

    const hasPending =
        recipients.some(
            (_, index) =>
                statuses[index] === "pending"
        );

    nextBtn.disabled =
        !hasPending || sending;

    sendBtn.disabled =
        !hasPending || sending;
}


function findNextPending() {

    for (
        let i = currentIndex;
        i < recipients.length;
        i++
    ) {

        if (statuses[i] === "pending") {
            return i;
        }
    }

    for (
        let i = 0;
        i < currentIndex;
        i++
    ) {

        if (statuses[i] === "pending") {
            return i;
        }
    }

    return -1;
}


async function sendCurrent() {

    if (sending) return;

    const index =
        findNextPending();

    if (index === -1) {

        showToast(
            "There are no pending recipients.",
            "error"
        );

        return;
    }


    const senderName =
        document
        .getElementById("senderName")
        .value
        .trim();

    const gmail =
        document
        .getElementById("gmail")
        .value
        .trim();

    const appPassword =
        document
        .getElementById("appPassword")
        .value
        .trim();

    const subject =
        document
        .getElementById("subject")
        .value
        .trim();

    const body =
        document
        .getElementById("messageBody")
        .value;


    if (
        !senderName ||
        !gmail ||
        !appPassword ||
        !subject ||
        !body.trim()
    ) {

        showToast(
            "Complete the sender and message fields first.",
            "error"
        );

        return;
    }


    currentIndex = index;

    renderRecipientList();

    sending = true;

    updateButtons();


    statusText.innerHTML =
        `<i class="fa-solid fa-circle-notch fa-spin"></i>
         Sending to ${recipients[index]}`;


    try {

        const response =
            await fetch("/send", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    sender_name: senderName,
                    gmail: gmail,
                    app_password: appPassword,
                    recipient: recipients[index],
                    subject: subject,
                    body: body

                })

            });


        const result =
            await response.json();


        if (result.success) {

            statuses[index] = "sent";

            showToast(
                `Sent to ${recipients[index]}.`,
                "success"
            );

        } else {

            statuses[index] = "failed";

            showToast(
                result.message || "Sending failed.",
                "error"
            );
        }


    } catch (error) {

        statuses[index] = "failed";

        showToast(
            "Could not connect to the server.",
            "error"
        );

    } finally {

        sending = false;

        const next =
            findNextPending();

        if (next !== -1) {
            currentIndex = next;
        }

        renderRecipientList();
        updateProgress();
        updateButtons();

    }
}


recipientsInput.addEventListener(
    "input",
    renderRecipients
);


sendBtn.addEventListener(
    "click",
    sendCurrent
);


nextBtn.addEventListener(
    "click",
    sendCurrent
);


document
.getElementById("togglePassword")
.addEventListener("click", function () {

    const input =
        document.getElementById("appPassword");

    if (input.type === "password") {

        input.type = "text";

        this.innerHTML =
            '<i class="fa-regular fa-eye-slash"></i>';

    } else {

        input.type = "password";

        this.innerHTML =
            '<i class="fa-regular fa-eye"></i>';
    }

});


resetBtn.addEventListener(
    "click",
    function () {

        if (sending) return;

        statuses =
            recipients.map(() => "pending");

        currentIndex = 0;

        renderRecipientList();
        updateProgress();
        updateButtons();

        showToast(
            "Progress has been reset.",
            "success"
        );

    }
);


let logoutClicks = 0;
let logoutTimer = null;


document
.getElementById("logoutBtn")
.addEventListener("click", function () {

    logoutClicks++;

    clearTimeout(logoutTimer);

    logoutTimer =
        setTimeout(() => {
            logoutClicks = 0;
        }, 600);


    if (logoutClicks >= 2) {

        logoutClicks = 0;

        showToast(
            "Logout action triggered.",
            "success"
        );
    }

});


renderRecipients();

</script>

</body>
</html>
