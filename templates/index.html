<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Mail Console</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="page">

    <!-- Header -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <div class="brand-name">
                Secure Mail Console
            </div>
        </div>

        <button class="logout-btn" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout (Double Click)
        </button>

    </header>


    <!-- Page title -->
    <div class="page-title">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Bulk Email Sender</span>
    </div>


    <!-- Main layout -->
    <main class="dashboard">

        <!-- LEFT -->
        <section class="left-column">

            <div class="card compose-card">

                <div class="card-heading">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Compose Message</span>
                </div>


                <div class="form-grid">

                    <div class="field">
                        <label>Sender Name</label>
                        <input
                            type="text"
                            id="senderName"
                            placeholder="Sender Name"
                            value="">
                    </div>

                    <div class="field">
                        <label>Your Gmail</label>
                        <input
                            type="email"
                            id="gmail"
                            placeholder="yourname@gmail.com">
                    </div>

                    <div class="field password-field">
                        <label>App Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="appPassword"
                                placeholder="App Password">

                            <button
                                type="button"
                                class="eye-btn"
                                id="togglePassword">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label>Email Subject</label>
                        <input
                            type="text"
                            id="subject"
                            placeholder="Email subject">
                    </div>

                </div>


                <div class="field body-field">

                    <label>
                        Message Body
                        (Plain Text / HTML)
                    </label>

                    <textarea
                        id="messageBody"
                        placeholder="Write your message here..."></textarea>

                </div>


                <!-- Spam Protection -->
                <div class="protection">

                    <div class="protection-title">
                        <i class="fa-solid fa-shield"></i>
                        Spam Protection
                    </div>

                    <div class="protection-box">

                        <div class="success-icon">
                            <i class="fa-solid fa-check"></i>
                        </div>

                        <div class="protection-text">
                            <strong>Ready</strong>
                            <span>Email security checks are enabled.</span>
                        </div>

                        <div class="cloud-mark">
                            <i class="fa-solid fa-cloud"></i>
                        </div>

                    </div>

                </div>


                <!-- Send button -->
                <button class="send-btn" id="sendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                    Send Email
                </button>

            </div>

        </section>


        <!-- RIGHT -->
        <section class="right-column">

            <!-- Recipients -->
            <div class="card recipients-card">

                <div class="recipients-header">

                    <div>
                        <div class="card-heading">
                            <i class="fa-solid fa-users"></i>
                            <span>Recipients</span>
                        </div>

                        <div class="helper">
                            Enter one email address
                        </div>
                    </div>

                    <div class="count-badge" id="recipientCount">
                        0 found
                    </div>

                </div>


                <textarea
                    id="recipients"
                    class="recipient-input"
                    placeholder="Enter recipient email address..."></textarea>

            </div>


            <!-- Progress -->
            <div class="card progress-card">

                <div class="card-heading">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Progress Monitor</span>
                </div>


                <div class="stats-grid">

                    <div class="stat-box">
                        <span class="stat-label">TOTAL</span>
                        <strong id="totalValue">0</strong>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">SENT</span>
                        <strong class="sent-value" id="sentValue">0</strong>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">FAILED</span>
                        <strong class="failed-value" id="failedValue">0</strong>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">REMAINING</span>
                        <strong class="remaining-value" id="remainingValue">0</strong>
                    </div>

                </div>


                <div class="progress-track">
                    <div
                        class="progress-fill"
                        id="progressFill">
                    </div>
                </div>


                <div class="sending-status" id="statusText">
                    <i class="fa-regular fa-circle"></i>
                    Ready to send
                </div>


                <div class="action-row">

                    <button
                        class="sending-btn"
                        id="sendingBtn"
                        disabled>
                        <i class="fa-solid fa-spinner"></i>
                        Sending...
                    </button>

                    <button
                        class="stop-btn"
                        id="stopBtn"
                        disabled>
                        <i class="fa-solid fa-stop"></i>
                        Stop Sending
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<div class="toast" id="toast"></div>


<script>

const recipients = document.getElementById("recipients");
const recipientCount = document.getElementById("recipientCount");

const totalValue = document.getElementById("totalValue");
const sentValue = document.getElementById("sentValue");
const failedValue = document.getElementById("failedValue");
const remainingValue = document.getElementById("remainingValue");

const progressFill = document.getElementById("progressFill");
const statusText = document.getElementById("statusText");

const sendBtn = document.getElementById("sendBtn");
const sendingBtn = document.getElementById("sendingBtn");
const stopBtn = document.getElementById("stopBtn");

const toast = document.getElementById("toast");

let stopped = false;


function showToast(message, success = true) {

    toast.textContent = message;
    toast.className = "toast show " + (success ? "success" : "error");

    setTimeout(() => {
        toast.className = "toast";
    }, 3500);
}


function getRecipient() {
    return recipients.value.trim();
}


function updateRecipientCount() {

    const value = getRecipient();

    const found = value ? 1 : 0;

    recipientCount.textContent = `${found} found`;

    totalValue.textContent = found;

    if (!found) {
        sentValue.textContent = "0";
        failedValue.textContent = "0";
        remainingValue.textContent = "0";
        progressFill.style.width = "0%";
    }
}


recipients.addEventListener("input", updateRecipientCount);


document.getElementById("togglePassword").addEventListener(
    "click",
    function () {

        const input = document.getElementById("appPassword");

        if (input.type === "password") {
            input.type = "text";
            this.innerHTML =
                '<i class="fa-regular fa-eye-slash"></i>';
        } else {
            input.type = "password";
            this.innerHTML =
                '<i class="fa-regular fa-eye"></i>';
        }

    }
);


async function sendEmail() {

    const recipient = getRecipient();

    const senderName =
        document.getElementById("senderName").value.trim();

    const gmail =
        document.getElementById("gmail").value.trim();

    const appPassword =
        document.getElementById("appPassword").value.trim();

    const subject =
        document.getElementById("subject").value.trim();

    const body =
        document.getElementById("messageBody").value;


    if (!senderName ||
        !gmail ||
        !appPassword ||
        !recipient ||
        !subject ||
        !body.trim()) {

        showToast(
            "Please complete all required fields.",
            false
        );

        return;
    }


    stopped = false;

    sendBtn.disabled = true;
    sendingBtn.disabled = false;
    stopBtn.disabled = false;

    statusText.innerHTML =
        '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending email...';

    sentValue.textContent = "0";
    failedValue.textContent = "0";
    remainingValue.textContent = "1";
    progressFill.style.width = "0%";


    try {

        const response = await fetch("/send", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                sender_name: senderName,
                gmail: gmail,
                app_password: appPassword,
                recipient: recipient,
                subject: subject,
                body: body

            })

        });


        const result = await response.json();


        if (result.success) {

            sentValue.textContent = "1";
            failedValue.textContent = "0";
            remainingValue.textContent = "0";

            progressFill.style.width = "100%";

            statusText.innerHTML =
                '<i class="fa-solid fa-circle-check"></i> Email sent successfully';

            showToast(
                "Email sent successfully.",
                true
            );

        } else {

            sentValue.textContent = "0";
            failedValue.textContent = "1";
            remainingValue.textContent = "0";

            progressFill.style.width = "0%";

            statusText.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i> Sending failed';

            showToast(
                result.message || "Sending failed.",
                false
            );

        }

    } catch (error) {

        failedValue.textContent = "1";
        remainingValue.textContent = "0";

        statusText.innerHTML =
            '<i class="fa-solid fa-circle-xmark"></i> Connection error';

        showToast(
            "Unable to connect to the server.",
            false
        );

    } finally {

        sendBtn.disabled = false;
        sendingBtn.disabled = true;
        stopBtn.disabled = true;

    }
}


sendBtn.addEventListener("click", sendEmail);


stopBtn.addEventListener("click", () => {

    stopped = true;

    statusText.innerHTML =
        '<i class="fa-solid fa-stop"></i> Sending stopped';

    sendBtn.disabled = false;
    sendingBtn.disabled = true;
    stopBtn.disabled = true;

});


let logoutClicks = 0;
let logoutTimer;


document.getElementById("logoutBtn").addEventListener(
    "click",
    function () {

        logoutClicks++;

        clearTimeout(logoutTimer);

        logoutTimer = setTimeout(() => {
            logoutClicks = 0;
        }, 600);

        if (logoutClicks >= 2) {

            showToast("Logout action triggered.");

            logoutClicks = 0;
        }

    }
);


updateRecipientCount();

</script>

</body>
</html>
