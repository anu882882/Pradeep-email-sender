<script>

function get(id) {
  return document.getElementById(id);
}


/* =================================
   RECIPIENTS
================================= */

function getRecipients() {

  var raw = get("recipients").value;

  var list = raw
    .split(/[\s,;]+/)
    .filter(Boolean);

  var unique = [];

  list.forEach(function(email) {

    email = email.trim().toLowerCase();

    if (
      email &&
      unique.indexOf(email) === -1
    ) {
      unique.push(email);
    }

  });

  return unique;
}


/* =================================
   COUNTER
================================= */

function updateCounter() {

  var list = getRecipients();

  get("total").textContent = list.length;

  if (list.length > 25) {

    get("protectMsg").textContent =
      "⚠ Maximum 25 recipients.";

  } else {

    checkMessage();

  }

}


get("recipients").addEventListener(
  "input",
  updateCounter
);


/* =================================
   MESSAGE CHECK
================================= */

function checkMessage() {

  var subject =
    get("sub").value.trim();

  var message =
    get("msg").value.trim();


  if (!subject && !message) {

    get("protectMsg").textContent =
      "Ready to check message.";

    return;
  }


  var text =
    subject + " " + message;


  var repeated =
    /(.)\1{7,}/.test(text);


  var links =
    text.match(
      /https?:\/\//gi
    ) || [];


  var unsafe =
    /<script|javascript:|<iframe/i
      .test(text);


  if (repeated) {

    get("protectMsg").textContent =
      "⚠ Repeated characters detected.";

    return;
  }


  if (links.length > 5) {

    get("protectMsg").textContent =
      "⚠ Message contains many links.";

    return;
  }


  if (unsafe) {

    get("protectMsg").textContent =
      "⚠ Unsafe HTML detected.";

    return;
  }


  get("protectMsg").textContent =
    "✓ Basic message checks passed.";

}


get("sub").addEventListener(
  "input",
  checkMessage
);

get("msg").addEventListener(
  "input",
  checkMessage
);


/* =================================
   HTML ESCAPE
================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =================================
   LIVE ROW
================================= */

function addRow(
  email,
  ref,
  failed
) {

  var row =
    document.createElement("div");

  row.className =
    failed
      ? "recipient-row failed"
      : "recipient-row";


  if (failed) {

    row.innerHTML =
      "✕ " +
      escapeHtml(email);

  } else {

    row.innerHTML =
      "✓ " +
      escapeHtml(email) +

      "<small>" +
      "Reference: " +
      escapeHtml(ref) +
      "</small>";

  }


  get("list")
    .appendChild(row);
}


/* =================================
   SEND EMAILS
================================= */

get("send").addEventListener(
  "click",
  async function() {

    var recipients =
      getRecipients();


    /* -----------------------------
       Validation
    ----------------------------- */

    if (!recipients.length) {

      get("status").textContent =
        "Add recipients first.";

      return;
    }


    if (recipients.length > 25) {

      get("status").textContent =
        "Maximum 25 recipients.";

      return;
    }


    if (!get("name").value.trim()) {

      get("status").textContent =
        "Enter sender name.";

      return;
    }


    if (!get("gmail").value.trim()) {

      get("status").textContent =
        "Enter Gmail address.";

      return;
    }


    if (!get("pass").value.trim()) {

      get("status").textContent =
        "Enter Gmail App Password.";

      return;
    }


    if (!get("sub").value.trim()) {

      get("status").textContent =
        "Enter subject.";

      return;
    }


    if (!get("msg").value.trim()) {

      get("status").textContent =
        "Enter message.";

      return;
    }


    /* -----------------------------
       NO CONFIRM POPUP HERE
       Sending starts immediately.
    ----------------------------- */

    get("send").disabled = true;

    get("status").textContent =
      "Sending emails...";


    get("sent").textContent =
      "0";

    get("failed").textContent =
      "0";

    get("progress").style.width =
      "0%";

    get("list").innerHTML =
      "";


    try {

      var response =
        await fetch(
          "/api/send",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              sender_name:
                get("name").value,

              gmail:
                get("gmail").value,

              app_password:
                get("pass").value,

              subject:
                get("sub").value,

              message:
                get("msg").value,

              recipients:
                recipients.join("\n")

            })

          }
        );


      var data =
        await response.json();


      /* -----------------------------
         SERVER ERROR
      ----------------------------- */

      if (!response.ok) {

        get("status").textContent =
          data.error ||
          "Sending failed.";

        return;
      }


      /* -----------------------------
         COUNTS
      ----------------------------- */

      get("sent").textContent =
        data.sent || 0;

      get("failed").textContent =
        data.failed || 0;


      /* -----------------------------
         PROGRESS
      ----------------------------- */

      var done =
        (data.sent || 0) +
        (data.failed || 0);


      var percent =
        data.total
          ? Math.round(
              done /
              data.total *
              100
            )
          : 0;


      get("progress").style.width =
        percent + "%";


      /* -----------------------------
         SENT RECIPIENTS
      ----------------------------- */

      (
        data.sent_emails || []
      ).forEach(function(item) {

        addRow(
          item.email,
          item.ref,
          false
        );

      });


      /* -----------------------------
         FAILED RECIPIENTS
      ----------------------------- */

      (
        data.failed_emails || []
      ).forEach(function(item) {

        addRow(
          item.email,
          item.ref,
          true
        );

      });


      /* -----------------------------
         COMPLETED
      ----------------------------- */

      get("status").textContent =
        "Completed: " +
        (data.sent || 0) +
        " sent, " +
        (data.failed || 0) +
        " failed.";


      /* =============================
         POPUP ONLY AFTER SENDING
      ============================= */

      if (
        (data.failed || 0) === 0 &&
        (data.sent || 0) > 0
      ) {

        alert(
          data.sent +
          " emails sent successfully."
        );

      } else {

        alert(
          "Sending completed.\n\n" +
          "Sent: " +
          (data.sent || 0) +
          "\n" +
          "Failed: " +
          (data.failed || 0)
        );

      }


    } catch (error) {

      get("status").textContent =
        "Server connection failed.";

    } finally {

      get("send").disabled =
        false;

    }

  }
);

</script>
