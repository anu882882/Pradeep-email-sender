<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Secure Mail Console</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    <h1>Secure Mail Console</h1>

    <div class="card">

        <label>Sender Name</label>

        <input
            id="senderName"
            type="text"
            placeholder="Sender name"
        >

        <label>Recipients</label>

        <textarea
            id="recipients"
            placeholder="Enter recipients..."
        ></textarea>

        <div class="recipient-count">
            Maximum 25 recipients
        </div>

        <label>Subject</label>

        <input
            id="subject"
            type="text"
            placeholder="Email subject"
        >

        <label>Message</label>

        <div
            id="messageEditor"
            class="editor"
            contenteditable="true"
        ></div>

    </div>


    <!-- PROGRESS -->

    <div class="card">

        <h2>◷ Progress Monitor</h2>

        <div class="stats">

            <div class="stat">
                <span>TOTAL</span>
                <strong id="totalCount">
                    0
                </strong>
            </div>

            <div class="stat sent">
                <span>SENT</span>
                <strong id="sentCount">
                    0
                </strong>
            </div>

            <div class="stat failed">
                <span>FAILED</span>
                <strong id="failedCount">
                    0
                </strong>
            </div>

            <div class="stat remaining">
                <span>REMAINING</span>
                <strong id="remainingCount">
                    0
                </strong>
            </div>

        </div>


        <div class="progress-track">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>


        <div
            id="batchStatus"
            class="batch-status"
        >
            Ready
        </div>


        <div
            id="sendingStatus"
            class="sending-status"
        >
            Ready to send
        </div>


        <div
            id="errorBox"
            class="error-box"
        ></div>


        <div class="buttons">

            <button
                id="sendButton"
                class="send-button"
            >
                ✣ Send
            </button>

            <button
                id="stopButton"
                class="stop-button"
                disabled
            >
                ■ Stop Sending
            </button>

        </div>

    </div>

</div>


<script>

let sending = false;
let stopRequested = false;

const sendButton =
    document.getElementById(
        "sendButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const totalEl =
    document.getElementById(
        "totalCount"
    );

const sentEl =
    document.getElementById(
        "sentCount"
    );

const failedEl =
    document.getElementById(
        "failedCount"
    );

const remainingEl =
    document.getElementById(
        "remainingCount"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const sendingStatus =
    document.getElementById(
        "sendingStatus"
    );

const batchStatus =
    document.getElementById(
        "batchStatus"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


function updateProgress(data) {

    const total =
        Number(data.total || 0);

    const sent =
        Number(data.sent || 0);

    const failed =
        Number(data.failed || 0);

    const remaining =
        Math.max(
            0,
            total - sent - failed
        );

    totalEl.textContent =
        total;

    sentEl.textContent =
        sent;

    failedEl.textContent =
        failed;

    remainingEl.textContent =
        remaining;

    const processed =
        sent + failed;

    const percentage =
        total > 0
            ? Math.round(
                (processed / total) * 100
            )
            : 0;

    progressBar.style.width =
        percentage + "%";
}


function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";
}


function hideError() {

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";
}


function setSending(active) {

    sending = active;

    sendButton.disabled =
        active;

    stopButton.disabled =
        !active;
}


async function startSending() {

    if (sending) {
        return;
    }

    hideError();

    stopRequested = false;

    const senderName =
        document.getElementById(
            "senderName"
        ).value.trim();

    const subject =
        document.getElementById(
            "subject"
        ).value.trim();

    const message =
        document.getElementById(
            "messageEditor"
        ).innerHTML.trim();

    const recipientText =
        document.getElementById(
            "recipients"
        ).value.trim();


    if (!recipientText) {

        showError(
            "Please enter recipients."
        );

        return;
    }


    const recipients =
        recipientText
            .split(/[\s,;]+/)
            .filter(Boolean);


    if (recipients.length > 25) {

        showError(
            "Maximum 25 recipients are allowed."
        );

        return;
    }


    if (!subject) {

        showError(
            "Subject is required."
        );

        return;
    }


    if (!message) {

        showError(
            "Message body is required."
        );

        return;
    }


    updateProgress({

        total:
            recipients.length,

        sent: 0,

        failed: 0,

        remaining:
            recipients.length

    });


    progressBar.style.width =
        "0%";


    setSending(true);

    sendingStatus.textContent =
        "Starting...";


    try {

        const response =
            await fetch(
                "/api/send-stream",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "text/event-stream"
                    },

                    body:
                        JSON.stringify({

                            sender_name:
                                senderName,

                            subject:
                                subject,

                            message_html:
                                message,

                            recipients:
                                recipients
                        })
                }
            );


        if (!response.ok) {

            let message =
                "Server error.";

            try {

                const data =
                    await response.json();

                if (data.error) {
                    message =
                        data.error;
                }

            } catch (e) {}

            throw new Error(
                message
            );
        }


        if (!response.body) {

            throw new Error(
                "Streaming is not available."
            );
        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();

        let buffer = "";

        let completed =
            false;


        while (true) {

            const result =
                await reader.read();

            if (result.done) {
                break;
            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream: true
                    }
                );


            const blocks =
                buffer.split(
                    "\n\n"
                );


            buffer =
                blocks.pop() || "";


            for (
                const block
                of blocks
            ) {

                if (!block.trim()) {
                    continue;
                }


                let eventName =
                    "";

                let dataText =
                    "";


                const lines =
                    block.split("\n");


                for (
                    const line
                    of lines
                ) {

                    if (
                        line.startsWith(
                            "event:"
                        )
                    ) {

                        eventName =
                            line
                                .substring(6)
                                .trim();
                    }


                    if (
                        line.startsWith(
                            "data:"
                        )
                    ) {

                        dataText +=
                            line
                                .substring(5)
                                .trim();
                    }

                }


                if (!dataText) {
                    continue;
                }


                let data;

                try {

                    data =
                        JSON.parse(
                            dataText
                        );

                } catch (e) {

                    continue;
                }


                if (
                    eventName ===
                    "start"
                ) {

                    updateProgress(
                        data
                    );

                    sendingStatus.textContent =
                        "Preparing batches...";

                    continue;
                }


                if (
                    eventName ===
                    "batch_start"
                ) {

                    batchStatus.textContent =
                        `Batch ${data.batch} started — ${data.batch_size} recipients`;

                    continue;
                }


                if (
                    eventName ===
                    "progress"
                ) {

                    updateProgress(
                        data
                    );

                    sendingStatus.textContent =
                        `Processing batch ${data.batch || 0}`;

                    continue;
                }


                if (
                    eventName ===
                    "batch_complete"
                ) {

                    updateProgress(
                        data
                    );

                    batchStatus.textContent =
                        `Batch ${data.batch} complete`;

                    continue;
                }


                if (
                    eventName ===
                    "complete"
                ) {

                    completed =
                        true;

                    updateProgress(
                        data
                    );

                    progressBar.style.width =
                        "100%";

                    batchStatus.textContent =
                        `${data.batches} batches completed`;

                    sendingStatus.textContent =
                        `Completed: ${data.sent} sent, ${data.failed} failed.`;

                    setSending(false);

                    try {
                        await reader.cancel();
                    } catch (e) {}

                    break;
                }


                if (
                    eventName ===
                    "error"
                ) {

                    showError(
                        data.message ||
                        "Sending failed."
                    );

                    sendingStatus.textContent =
                        "Sending failed.";

                    setSending(false);

                    break;
                }

            }


            if (completed) {
                break;
            }


            if (stopRequested) {

                try {
                    await reader.cancel();
                } catch (e) {}

                break;
            }

        }


        if (stopRequested) {

            sendingStatus.textContent =
                "Sending stopped.";

            setSending(false);

        }

        else if (!completed) {

            showError(
                "Connection ended before completion."
            );

            sendingStatus.textContent =
                "Sending stopped unexpectedly.";

            setSending(false);
        }


    } catch (error) {

        console.error(
            error
        );

        showError(
            error.message ||
            "Network error."
        );

        sendingStatus.textContent =
            "Sending failed.";

        setSending(false);
    }

}


function stopSending() {

    stopRequested =
        true;

    sendingStatus.textContent =
        "Stopping...";
}


sendButton.addEventListener(
    "click",
    startSending
);


stopButton.addEventListener(
    "click",
    stopSending
);

</script>

</body>
</html>
