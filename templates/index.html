<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Secure Mail Console</title>

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='style.css') }}"
>

</head>


<body>


<header>

<div class="brand">

<strong>
✉ Secure Mail Console
</strong>

<small>
Gmail Mail Sender
</small>

</div>


<a href="/logout">
Logout
</a>

</header>



<main>


<!-- =================================
     SENDER
================================= -->

<section class="card">


<h2>
Sender
</h2>


<label>
Sender Name
</label>

<input
  id="name"
  type="text"
  placeholder="Your name"
>


<label>
Your Gmail
</label>

<input
  id="gmail"
  type="email"
  placeholder="your@gmail.com"
>


<label>
App Password
</label>

<input
  id="pass"
  type="password"
  placeholder="Gmail App Password"
>


<label>
Subject
</label>

<input
  id="sub"
  type="text"
  placeholder="Email subject"
>


<label>
Message Body
</label>

<textarea
  id="msg"
  placeholder="Write your message..."
></textarea>


<button
  id="send"
  type="button"
>
Send Emails
</button>


<p id="status"></p>



<!-- =================================
     SPAM PROTECTION
================================= -->

<div class="protection">


<h3>
✓ Spam Protection
</h3>


<div>
✓ Duplicate recipients filtered
</div>


<div>
✓ Invalid email addresses checked
</div>


<div>
✓ Message content checked
</div>


<div>
✓ Maximum 25 recipients
</div>


<div>
✓ Controlled sending
</div>


<p id="protectMsg">
Ready to check message.
</p>


</div>


</section>



<!-- =================================
     RECIPIENTS
================================= -->

<section class="card">


<h2>
Recipients
</h2>


<textarea
  id="recipients"
  placeholder="one@email.com&#10;two@email.com&#10;three@email.com"
></textarea>



<div class="stats">


<div>

<strong id="total">
0
</strong>

<span>
Total
</span>

</div>


<div>

<strong id="sent">
0
</strong>

<span>
Sent
</span>

</div>


<div>

<strong id="failed">
0
</strong>

<span>
Failed
</span>

</div>


</div>



<div class="progress">

<div id="progress"></div>

</div>



<h3>
Live Recipients Dispatch
</h3>


<div id="list"></div>


</section>


</main>



<script>


// ========================================
// ELEMENT HELPER
// ========================================

function get(id) {

  return document.getElementById(id);

}



// ========================================
// RECIPIENTS
// ========================================

function getRecipients() {

  var raw =
    get("recipients").value;


  var list =
    raw
      .split(/[\s,;]+/)
      .filter(Boolean);


  var unique = [];


  list.forEach(function(email) {

    email =
      email
        .trim()
        .toLowerCase();


    if (
      email &&
      unique.indexOf(email) === -1
    ) {

      unique.push(email);

    }

  });


  return unique;

}



// ========================================
// COUNTER
// ========================================

function updateCounter() {

  var list =
    getRecipients();


  get("total")
    .textContent =
    list.length;


  if (list.length > 25) {

    get("protectMsg")
      .textContent =
      "⚠ Maximum 25 recipients.";

  } else {

    checkMessage();

  }

}


get("recipients")
  .addEventListener(
    "input",
    updateCounter
  );



// ========================================
// MESSAGE CHECK
// ========================================

function checkMessage() {

  var subject =
    get("sub").value.trim();


  var message =
    get("msg").value.trim();


  if (!subject && !message) {

    get("protectMsg")
      .textContent =
      "Ready to check message.";

    return;

  }


  var text =
    subject + " " + message;


  var repeated =
    /(.)\1{7,}/.test(text);


  var links =
    text.match(
      /https?:\/\//gi
    ) || [];


  var unsafe =
    /<script|javascript:|<iframe/i
      .test(text);


  if (repeated) {

    get("protectMsg")
      .textContent =
      "⚠ Repeated characters detected.";

    return;

  }


  if (links.length > 5) {

    get("protectMsg")
      .textContent =
      "⚠ Message contains many links.";

    return;

  }


  if (unsafe) {

    get("protectMsg")
      .textContent =
      "⚠ Unsafe HTML detected.";

    return;

  }


  get("protectMsg")
    .textContent =
    "✓ Basic message checks passed.";

}


get("sub")
  .addEventListener(
    "input",
    checkMessage
  );


get("msg")
  .addEventListener(
    "input",
    checkMessage
  );



// ========================================
// HTML ESCAPE
// ========================================

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



// ========================================
// LIVE ROW
// ========================================

function addRow(
  email,
  ref,
  failed
) {


  var row =
    document.createElement(
      "div"
    );


  row.className =
    failed
      ? "recipient-row failed"
      : "recipient-row";


  if (failed) {

    row.innerHTML =
      "✕ " +
      escapeHtml(email);

  } else {

    row.innerHTML =
      "✓ " +
      escapeHtml(email) +

      "<small>" +

      "Reference: " +

      escapeHtml(ref) +

      "</small>";

  }


  get("list")
    .appendChild(row);

}



// ========================================
// SEND
// ========================================

get("send")
  .addEventListener(
    "click",
    async function() {


      var recipients =
        getRecipients();


      if (!recipients.length) {

        get("status")
          .textContent =
          "Add recipients first.";

        return;

      }


      if (recipients.length > 25) {

        get("status")
          .textContent =
          "Maximum 25 recipients.";

        return;

      }


      if (!get("name").value.trim()) {

        get("status")
          .textContent =
          "Enter sender name.";

        return;

      }


      if (!get("gmail").value.trim()) {

        get("status")
          .textContent =
          "Enter Gmail address.";

        return;

      }


      if (!get("pass").value.trim()) {

        get("status")
          .textContent =
          "Enter Gmail App Password.";

        return;

      }


      if (!get("sub").value.trim()) {

        get("status")
          .textContent =
          "Enter subject.";

        return;

      }


      if (!get("msg").value.trim()) {

        get("status")
          .textContent =
          "Enter message.";

        return;

      }


      var confirmed =
        window.confirm(
          "Send to " +
          recipients.length +
          " recipient(s)?"
        );


      if (!confirmed) {

        return;

      }


      get("send")
        .disabled =
        true;


      get("status")
        .textContent =
        "Connecting to Gmail...";


      get("sent")
        .textContent =
        "0";


      get("failed")
        .textContent =
        "0";


      get("progress")
        .style.width =
        "0%";


      get("list")
        .innerHTML =
        "";


      try {


        var response =
          await fetch(
            "/api/send",
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  sender_name:
                    get("name").value,

                  gmail:
                    get("gmail").value,

                  app_password:
                    get("pass").value,

                  subject:
                    get("sub").value,

                  message:
                    get("msg").value,

                  recipients:
                    recipients.join("\n")

                })

            }
          );


        var data =
          await response.json();


        if (!response.ok) {

          get("status")
            .textContent =
            data.error ||
            "Sending failed.";

          return;

        }


        // =================================
        // SENT
        // =================================

        get("sent")
          .textContent =
          data.sent;


        get("failed")
          .textContent =
          data.failed;


        // =================================
        // PROGRESS
        // =================================

        var done =
          data.sent +
          data.failed;


        var percent =
          data.total
            ? Math.round(
                done /
                data.total *
                100
              )
            : 0;


        get("progress")
          .style.width =
          percent + "%";


        // =================================
        // SENT EMAILS
        // =================================

        (
          data.sent_emails || []
        ).forEach(function(item) {

          addRow(
            item.email,
            item.ref,
            false
          );

        });


        // =================================
        // FAILED EMAILS
        // =================================

        (
          data.failed_emails || []
        ).forEach(function(item) {

          addRow(
            item.email,
            item.ref,
            true
          );

        });


        // =================================
        // STATUS
        // =================================

        get("status")
          .textContent =
          "Completed: " +
          data.sent +
          " sent, " +
          data.failed +
          " failed.";


      } catch (error) {


        get("status")
          .textContent =
          "Server connection failed.";


      } finally {


        get("send")
          .disabled =
          false;

      }

    }
  );

</script>


</body>

</html>
