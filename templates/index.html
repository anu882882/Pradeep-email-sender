<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Secure Mail Console</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<script
src="https://challenges.cloudflare.com/turnstile/v0/api.js"
async
defer>
</script>

</head>


<body>


<header>

<div class="top-brand">

<div class="shield">
♢
</div>

<strong>
Secure Mail Console
</strong>

</div>


<a
class="logout"
href="/logout">

↪ Logout

</a>

</header>


<main>


<div class="page-title">

<span>➤</span>

<strong>
Bulk Email Sender
</strong>

</div>


<div class="dashboard">


<!-- ================================
     COMPOSE
================================ -->

<section class="compose card">


<div class="card-title">

<span>✎</span>

<strong>
Compose Message
</strong>

</div>


<div class="form-grid">


<div>

<label>
Sender Name
</label>

<input
id="name"
placeholder="E.g., John Doe">

</div>


<div>

<label>
Your Gmail
</label>

<input
id="gmail"
type="email"
placeholder="you@gmail.com">

</div>


<div>

<label>
App Password
</label>

<div class="password-box">

<input
id="pass"
type="password"
placeholder="16-char app password">

<button
type="button"
id="togglePassword">
◉
</button>

</div>

</div>


<div>

<label>
Email Subject
</label>

<input
id="sub"
placeholder="Enter subject line...">

</div>


</div>


<label class="message-label">

Message Body (Plain Text / HTML)

</label>


<textarea
id="msg"
class="message"
placeholder="Write your email here... Spintax supported: {Hi|Hello} {name}"></textarea>


<div class="turnstile-area">

<div
class="cf-turnstile"
data-sitekey="{{ turnstile_site_key }}"
data-theme="light">
</div>

</div>


</section>


<!-- ================================
     RIGHT
================================ -->

<div class="right-column">


<section class="card recipients-card">


<div class="card-title recipients-title">

<div>

<span>♣</span>

<strong>
Recipients
</strong>

</div>


<span
class="found"
id="found">

0 found

</span>

</div>


<div class="recipient-help">

Paste emails (comma separated, new lines, or Excel copy)

</div>


<textarea
id="recipients"
class="recipient-input"
placeholder="recipient1@example.com
recipient2@example.com
recipient3@example.com"></textarea>


</section>


<!-- ================================
     PROGRESS
================================ -->

<section class="card progress-card">


<div class="card-title">

<span>◕</span>

<strong>
Progress Monitor
</strong>

</div>


<div class="stats">


<div class="stat">

<span>TOTAL</span>

<strong id="total">
0
</strong>

</div>


<div class="stat sent-stat">

<span>SENT</span>

<strong id="sent">
0
</strong>

</div>


<div class="stat failed-stat">

<span>FAILED</span>

<strong id="failed">
0
</strong>

</div>


<div class="stat remaining-stat">

<span>REMAINING</span>

<strong id="remaining">
0
</strong>

</div>


</div>


<div class="progress-track">

<div
id="progress"
class="progress-bar">
</div>

</div>


<div
class="send-status"
id="status">

● Ready to send

</div>


<div
class="batch-status"
id="batchStatus">

</div>


<button
id="send"
class="send-button">

➤ Send All

</button>


</section>


</div>


</div>


</main>


<script>


const $ =
id => document.getElementById(id);


let sending = false;


/* =====================================
   PASSWORD
===================================== */

$("togglePassword").onclick =
function(){

    const input =
        $("pass");

    input.type =
        input.type === "password"
        ? "text"
        : "password";

};


/* =====================================
   RECIPIENTS
===================================== */

function getRecipients(){

    return [

        ...new Set(

            $("recipients")
            .value
            .split(/[\s,;]+/)
            .map(
                x =>
                x.trim().toLowerCase()
            )
            .filter(Boolean)

        )

    ];

}


/* =====================================
   COUNT
===================================== */

function updateCount(){

    const list =
        getRecipients();

    $("found").textContent =
        `${list.length} found`;

    $("total").textContent =
        list.length;

    $("remaining").textContent =
        list.length;

}


$("recipients").addEventListener(
    "input",
    updateCount
);


/* =====================================
   MESSAGE CHECK
===================================== */

function messageCheck(){

    const text =
        $("sub").value +
        " " +
        $("msg").value;


    if(
        /<\s*(script|iframe|object|embed)\b/i
        .test(text)
    ){

        $("status").textContent =
            "⚠ Unsafe HTML detected.";

        return false;

    }


    if(
        /javascript\s*:/i
        .test(text)
    ){

        $("status").textContent =
            "⚠ Unsafe content detected.";

        return false;

    }


    if(
        (text.match(/https?:\/\//gi) || [])
        .length > 5
    ){

        $("status").textContent =
            "⚠ Too many links.";

        return false;

    }


    return true;

}


$("sub").addEventListener(
    "input",
    messageCheck
);

$("msg").addEventListener(
    "input",
    messageCheck
);


/* =====================================
   TURNSTILE
===================================== */

function getTurnstileToken(){

    const input =
        document.querySelector(
            '[name="cf-turnstile-response"]'
        );

    return input
        ? input.value
        : "";

}


/* =====================================
   SLEEP
===================================== */

function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(
            resolve,
            ms
        )
    );

}


/* =====================================
   SEND ALL
===================================== */

$("send").onclick =
async function(){


    if(sending)
        return;


    const all =
        getRecipients();


    if(!all.length){

        $("status").textContent =
            "Add recipients first.";

        return;

    }


    if(all.length > 25){

        $("status").textContent =
            "Maximum 25 recipients.";

        return;

    }


    const required = [

        [
            "name",
            "Enter sender name."
        ],

        [
            "gmail",
            "Enter Gmail address."
        ],

        [
            "pass",
            "Enter Gmail App Password."
        ],

        [
            "sub",
            "Enter email subject."
        ],

        [
            "msg",
            "Enter message."
        ]

    ];


    for(
        const [id, error] of required
    ){

        if(
            !$(id).value.trim()
        ){

            $("status").textContent =
                error;

            return;

        }

    }


    if(!messageCheck())
        return;


    const token =
        getTurnstileToken();


    if(!token){

        $("status").textContent =
            "Please complete Cloudflare verification.";

        return;

    }


    /*
     * IMPORTANT
     *
     * Take a complete snapshot BEFORE
     * sending starts.
     *
     * Changing the UI afterwards will NOT
     * change the active sending operation.
     */

    const sendSnapshot = {

        sender_name:
            $("name").value,

        gmail:
            $("gmail").value,

        app_password:
            $("pass").value,

        subject:
            $("sub").value,

        message:
            $("msg").value

    };


    const recipientsSnapshot =
        [...all];


    sending = true;

    $("send").disabled =
        true;


    $("sent").textContent =
        "0";

    $("failed").textContent =
        "0";

    $("remaining").textContent =
        recipientsSnapshot.length;

    $("progress").style.width =
        "0%";

    $("batchStatus").textContent =
        "";


    let sentCount = 0;

    let failedCount = 0;

    let processed = 0;


    /*
     * ==================================
     * 5 EMAILS PER BATCH
     * ==================================
     */

    for(
        let start = 0;
        start < recipientsSnapshot.length;
        start += 5
    ){


        const batch =
            recipientsSnapshot.slice(
                start,
                start + 5
            );


        const batchNumber =
            Math.floor(start / 5) + 1;


        const totalBatches =
            Math.ceil(
                recipientsSnapshot.length / 5
            );


        $("status").textContent =
            "● Sending...";


        $("batchStatus").textContent =
            `Batch ${batchNumber} of ${totalBatches} — ${batch.length} emails`;


        let responseData = null;


        /*
         * Retry a temporary server failure.
         *
         * Credentials remain the SAME
         * snapshot throughout the operation.
         */

        for(
            let attempt = 1;
            attempt <= 2;
            attempt++
        ){

            try{

                const response =
                    await fetch(
                        "/api/send-batch",
                        {
                            method:
                                "POST",

                            headers:{
                                "Content-Type":
                                "application/json"
                            },

                            body:
                                JSON.stringify({

                                    ...sendSnapshot,

                                    recipients:
                                        batch,

                                    turnstile_token:
                                        start === 0
                                        ? token
                                        : ""

                                })
                        }
                    );


                responseData =
                    await response.json();


                if(response.ok){
                    break;
                }


                /*
                 * Authentication errors should not
                 * be retried repeatedly.
                 */

                if(response.status === 401){

                    $("status").textContent =
                        "✕ Gmail authentication failed.";

                    $("batchStatus").textContent =
                        "Sending stopped. Check the Gmail App Password.";

                    sending = false;

                    $("send").disabled =
                        false;

                    return;

                }


                if(attempt < 2){

                    await sleep(1500);

                }

            }catch(error){

                if(attempt < 2){

                    await sleep(1500);

                }

            }

        }


        if(
            !responseData
        ){

            $("status").textContent =
                "✕ Server connection failed.";

            break;

        }


        if(
            responseData.error
        ){

            $("status").textContent =
                responseData.error;

            break;

        }


        /*
         * ==================================
         * UPDATE PROGRESS IMMEDIATELY
         * ==================================
         */

        sentCount +=
            responseData.sent.length;


        failedCount +=
            responseData.failed.length;


        processed =
            sentCount +
            failedCount;


        $("sent").textContent =
            sentCount;


        $("failed").textContent =
            failedCount;


        $("remaining").textContent =
            recipientsSnapshot.length -
            processed;


        $("progress").style.width =

            Math.round(

                (
                    processed /
                    recipientsSnapshot.length
                ) * 100

            ) + "%";


        $("status").textContent =
            `✓ ${processed} of ${recipientsSnapshot.length} processed`;


        /*
         * Wait before next 5.
         */

        if(
            start + 5 <
            recipientsSnapshot.length
        ){

            await sleep(2500);

        }

    }


    /*
     * ==================================
     * COMPLETE
     * ==================================
     */

    if(
        processed ===
        recipientsSnapshot.length
    ){

        $("status").textContent =
            `● Completed — ${sentCount} sent, ${failedCount} failed.`;

        $("batchStatus").textContent =
            "All batches completed.";

        $("remaining").textContent =
            "0";

        $("progress").style.width =
            "100%";

    }


    sending = false;

    $("send").disabled =
        false;


    if(window.turnstile){

        window.turnstile.reset();

    }

};


updateCount();


</script>


</body>

</html>
