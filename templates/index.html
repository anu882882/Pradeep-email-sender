
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Mail Console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⬡</span>
      <div>
        <strong>Secure Mail Console</strong>
        <div class="muted">PRIVATE WORKSPACE</div>
      </div>
    </div>
    <a href="/logout">Sign out</a>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Compose email</h2>
      <p class="muted">SMTP sender: {{ smtp_user }}</p>

      <form id="mailForm">
        <label for="recipients">Recipients</label>
        <textarea id="recipients" rows="5"
          placeholder="One email address per line" required></textarea>

        <label for="subject">Subject</label>
        <input id="subject" maxlength="200" required>

        <label for="body">Message Body</label>
        <select id="mode">
          <option value="plain">Plain text</option>
          <option value="html">HTML</option>
        </select>
        <textarea id="body" rows="10" required
          placeholder="Write your message here"></textarea>

        <label class="consent">
          <input type="checkbox" id="consent" required>
          I confirm these recipients have agreed to receive this email.
        </label>

        <button class="primary-btn" id="sendBtn" type="submit">
          Send emails
        </button>
      </form>

      <div id="status" class="status" role="status"></div>
      <div id="results"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("mailForm");
    const sendBtn = document.getElementById("sendBtn");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const recipients = [...new Set(
        document.getElementById("recipients").value
          .split(/[\n,;]+/)
          .map(value => value.trim())
          .filter(Boolean)
      )];

      const subject = document.getElementById("subject").value.trim();
      const body = document.getElementById("body").value.trim();

      if (!recipients.length || !subject || !body) {
        statusBox.textContent = "Enter recipients, subject, and message.";
        return;
      }

      if (recipients.length > 25) {
        statusBox.textContent = "Maximum 25 recipients per batch.";
        return;
      }

      if (!document.getElementById("consent").checked) {
        statusBox.textContent = "Please confirm recipient permission.";
        return;
      }

      sendBtn.disabled = true;
      statusBox.textContent = "Sending emails. Please wait…";
      resultsBox.replaceChildren();

      try {
        const response = await fetch("/send-batch", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            recipients,
            subject,
            body,
            htmlMode: document.getElementById("mode").value === "html",
            consentConfirmed: document.getElementById("consent").checked
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Sending request failed.");
        }

        statusBox.textContent =
          `SMTP accepted: ${data.sent} · Failed: ${data.failed} · Total: ${data.total}`;

        data.results.forEach(item => {
          const row = document.createElement("p");
          row.textContent =
            `${item.status.toUpperCase()} — ${item.email}: ${item.detail}`;
          resultsBox.appendChild(row);
        });
      } catch (error) {
        statusBox.textContent = error.message;
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
