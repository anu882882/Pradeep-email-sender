<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Secure Mail Console</title>

<link rel="stylesheet"
href="{{ url_for('static',filename='style.css') }}">
</head>

<body class="login-page">

<div class="login-box">

<h1>🛡️ Secure Mail Console</h1>

<p>Private access</p>

<form method="POST">

<input
type="password"
name="password"
placeholder="Enter login password"
required
autofocus
>

<button type="submit">
Login
</button>

{% if error %}
<div class="login-error">
{{ error }}
</div>
{% endif %}

</form>

</div>

</body>
</html>
