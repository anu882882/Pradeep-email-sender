<CodeBlock language="html" editable>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mail Operations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">M</div>
        <div class="eyebrow">MAIL OPERATIONS</div>
        <h1>Welcome Back</h1>
        <p class="section-description">Sign in to access your secure mail console.</p>

{% if error %}
            <div class="login-error">{{ error }}</div>
        {% endif %}

<form method="POST">
            <label for="password">Access Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
                autofocus
            >
            <button class="btn btn-primary" type="submit">Sign In</button>
        </form>
        <p class="login-footer">Secure Mail Console</p>
    </div>
</body>
</html>
</CodeBlock>
