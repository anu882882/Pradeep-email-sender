<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Secure Mail Console</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body class="login-page">

<div class="login-card">

    <div class="login-icon">
        🛡️
    </div>

    <h1>
        Secure Mail Console
    </h1>

    <p>
        Private access
    </p>

    <form
        method="post"
        autocomplete="off"
    >

        <input
            type="password"
            name="password"
            placeholder="Login password"
            autocomplete="current-password"
            required
            autofocus
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

</div>

</body>
</html>
