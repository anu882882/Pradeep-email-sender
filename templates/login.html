<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Secure Mail Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <main class="login-card">
        <span class="brand-kicker">MAIL OPERATIONS</span>
        <h1>Secure Mail Console</h1>
        <p class="login-description">Sign in to continue to your workspace.</p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="password">Workspace Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-submit">Log in</button>
        </form>
    </main>

</body>
</html>
