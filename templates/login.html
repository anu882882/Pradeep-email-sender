<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Mail Console</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        body.login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f4f7fb,
                    #edf2fa
                );
        }


        .login-card {

            width: 100%;

            max-width: 390px;

            background: #fff;

            border:
                1px solid #e0e6ef;

            border-radius: 14px;

            padding: 38px;

            text-align: center;

            box-shadow:
                0 15px 45px
                rgba(
                    31,
                    52,
                    82,
                    0.10
                );
        }


        .login-shield {

            width: 60px;

            height: 60px;

            margin:
                0 auto
                15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background: #edf4ff;

            color: #397df4;

            font-size: 31px;
        }


        .login-card h1 {

            margin: 0;

            font-size: 25px;

            background:
                linear-gradient(
                    90deg,
                    #347cff,
                    #6558e8
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .login-subtitle {

            margin:
                8px
                0
                27px;

            color: #75849b;

            font-size: 13px;
        }


        .login-error {

            background: #fff1f1;

            border:
                1px solid #ffcaca;

            color: #dc3d45;

            border-radius: 7px;

            padding: 10px;

            font-size: 12px;

            margin-bottom: 17px;
        }


        .login-form {

            text-align: left;
        }


        .login-form label {

            display: block;

            margin-bottom: 7px;

            color: #16243b;

            font-size: 11px;

            font-weight: 700;
        }


        .login-form input {

            width: 100%;

            height: 45px;

            border:
                1px solid #d5ddea;

            border-radius: 7px;

            outline: none;

            padding:
                0
                13px;

            font-size: 13px;

            color: #27364c;
        }


        .login-form input:focus {

            border-color: #80a8ff;

            box-shadow:
                0 0 0 3px
                rgba(
                    72,
                    119,
                    255,
                    0.08
                );
        }


        .login-btn {

            width: 100%;

            height: 44px;

            margin-top: 17px;

            border: 0;

            border-radius: 7px;

            background:
                linear-gradient(
                    90deg,
                    #347cf4,
                    #5d62e9
                );

            color: #fff;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }


        .login-btn:hover {
            opacity: 0.94;
        }

    </style>

</head>


<body class="login-page">

    <div class="login-card">

        <div class="login-shield">
            🛡
        </div>


        <h1>
            Secure Mail Console
        </h1>


        <p class="login-subtitle">
            Sign in to continue
        </p>


        {% if error %}

        <div class="login-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            class="login-form"
        >

            <label for="password">
                Password
            </label>


            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="login-btn"
            >
                Sign In
            </button>

        </form>

    </div>

</body>

</html>
