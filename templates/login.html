<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Secure Mail Console - Login</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body class="login-screen">


<main class="login-wrapper">

    <div class="login-symbol">
        <i class="fa-solid fa-shield-halved"></i>
    </div>


    <h1>
        Secure Mail Console
    </h1>


    <p>
        Sign in to continue
    </p>


    <form
        method="post"
        autocomplete="off"
    >

        <label for="loginPassword">
            Password
        </label>


        <div class="login-input">

            <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="Enter password"
                required
                autofocus
            >


            <button
                type="button"
                id="loginEye"
            >
                <i class="fa-regular fa-eye"></i>
            </button>

        </div>


        {% if error %}

        <div class="login-alert">

            <i class="fa-solid fa-circle-exclamation"></i>

            {{ error }}

        </div>

        {% endif %}


        <button
            class="login-submit"
            type="submit"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>

    </form>


    <footer>
        <i class="fa-solid fa-shield-halved"></i>
        Secure Mail Console
    </footer>

</main>


<script>

const loginField =
    document.getElementById(
        "loginPassword"
    );


document
    .getElementById("loginEye")
    .addEventListener(
        "click",
        function() {

            const show =
                loginField.type ===
                "password";


            loginField.type =
                show
                    ? "text"
                    : "password";


            this.innerHTML =
                show
                    ? '<i class="fa-regular fa-eye-slash"></i>'
                    : '<i class="fa-regular fa-eye"></i>';

        }
    );

</script>

</body>
</html>
