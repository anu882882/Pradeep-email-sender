<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Mail Console - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-icon">
            ✉
        </div>

        <h1>Secure Mail Console</h1>

        <p class="login-subtitle">
            Sign in to continue
        </p>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

        <div class="login-footer">
            Secure Mail Console
        </div>

    </div>

</body>
</html>
