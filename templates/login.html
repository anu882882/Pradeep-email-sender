
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Secure Mail Console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">⬡</div>
    <p class="muted">PRIVATE WORKSPACE</p>
    <h1>Secure Mail <span>Console</span></h1>
    <p>Sign in to continue to your workspace.</p>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="password">Workspace Password</label>
      <input id="password" name="password" type="password"
        placeholder="Enter password" autocomplete="current-password" required>
      <button class="primary-btn full" type="submit">Sign in ›</button>
    </form>
  </main>
</body>
</html>
