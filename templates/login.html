<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Secure Mail Console</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="login-page">
  <main class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h1>Secure Mail Console</h1>
    <p class="login-subtitle">Sign in to access your email workspace.</p>

    {% if error %}
    <div class="login-error" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" autocomplete="on">
      <label for="password">Access password</label>

      <div class="login-password">
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          autofocus
        >

        <button
          type="button"
          id="showPassword"
          aria-label="Show password"
          title="Show password"
        >
          <i class="fa-regular fa-eye" id="passwordIcon"></i>
        </button>
      </div>

      <button class="primary-button" type="submit">
        <i class="fa-solid fa-lock-open"></i>
        Sign in securely
      </button>
    </form>

    <p class="login-footer">
      <i class="fa-solid fa-shield-halved"></i>
      Private workspace · Protected sign-in
    </p>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const showPasswordButton = document.getElementById("showPassword");
    const passwordIcon = document.getElementById("passwordIcon");

    showPasswordButton.addEventListener("click", () => {
      const reveal = passwordInput.type === "password";

      passwordInput.type = reveal ? "text" : "password";

      passwordIcon.className = reveal
        ? "fa-regular fa-eye-slash"
        : "fa-regular fa-eye";

      showPasswordButton.setAttribute(
        "aria-label",
        reveal ? "Hide password" : "Show password"
      );

      showPasswordButton.title = reveal
        ? "Hide password"
        : "Show password";
    });
  </script>
</body>
</html>
