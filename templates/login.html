
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Mail Console | Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% if turnstile_site_key %}
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {% endif %}
</head>
<body class="login-page">
  <main class="login-card">
    <div class="shield login-shield">◈</div>
    <p class="login-eyebrow">SECURE ACCESS</p>
    <h1>Secure Mail Console</h1>
    <p class="login-subtitle">Sign in to continue</p>

    {% if error %}
    <div class="error-notice login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             placeholder="Enter password" autocomplete="current-password" required autofocus>

      {% if turnstile_site_key %}
      <div class="login-turnstile">
        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>
      </div>
      {% else %}
      <p class="error-notice">Cloudflare verification is not configured.</p>
      {% endif %}

      <button type="submit" class="login-submit">Sign In <span>→</span></button>
    </form>

    <p class="login-footer">Protected access · Secure Mail Console</p>
  </main>
</body>
</html>
