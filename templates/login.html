<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Secure Mail Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <h1 class="brand">◈ Secure Mail Console</h1>
    <h2>Sign in to continue</h2>
    <p class="subtitle">Enter your console password.</p>

    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             placeholder="Enter password" autocomplete="current-password" required>

      <div class="turnstile-login">
        {% if turnstile_site_key %}
          <div class="cf-turnstile"
               data-sitekey="{{ turnstile_site_key }}"
               data-theme="dark"></div>
        {% else %}
          <p class="hint">Cloudflare Turnstile is not configured.</p>
        {% endif %}
      </div>

      <button type="submit" class="btn-send login-submit">Sign In</button>
    </form>
  </main>
</body>
</html>
