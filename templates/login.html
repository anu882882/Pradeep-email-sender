
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Secure Mail Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-logo">✉</div>
    <div class="eyebrow">SECURE WORKSPACE</div>
    <h1>Secure Mail <span>Console</span></h1>
    <p class="login-subtitle">Sign in to continue to your workspace.</p>

    {% if error %}
    <div class="notice error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password"
               placeholder="Enter password" autocomplete="current-password"
               required autofocus>
        <button type="button" id="showPassword" aria-label="Show password">Show</button>
      </div>
      <button class="send-button login-button" type="submit">Sign in <span class="button-arrow">→</span></button>
    </form>
    <div class="login-security">⌑ &nbsp; Protected private access</div>
  </main>

<script>
const password = document.getElementById("password");
const toggle = document.getElementById("showPassword");
toggle.addEventListener("click", () => {
  const visible = password.type === "password";
  password.type = visible ? "text" : "password";
  toggle.textContent = visible ? "Hide" : "Show";
  toggle.setAttribute("aria-label", visible ? "Hide password" : "Show password");
});
</script>
</body>
</html>
