<CodeBlock language="html" editable>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mail Operations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>


<main class="login-page">
    <section class="login-card">
        <div class="login-logo">M</div>


<div class="eyebrow">MAIL OPERATIONS</div>
<h1>Secure Mail Console</h1>
<p class="section-description">Enter your password to continue.</p>

{% if error %}
<div class="login-error">{{ error }}</div>
{% endif %}

<form method="POST" action="{{ url_for('login') }}">
<label for="password">Login Password</label>
<input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
                autofocus
            >

<button type="submit" class="btn btn-primary">
Login
</button>
</form>

<p class="login-footer">Secure access only</p>
</section>

</main>


</body>
</html>
</CodeBlock>
